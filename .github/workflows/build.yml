name: Build ProTracker firmware (Tracker+)

on:
  push:
    branches: [ main, protracker-mode ]
  pull_request:
    branches: [ main, protracker-mode ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Host tests (module loader/saver and replayer)
        run: |
          cd tests/protracker
          g++ -std=c++17 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I../../core/protracker test_protracker.cpp \
            ../../core/protracker/ptModule.cpp ../../core/protracker/ptReplayer.cpp \
            ../../core/protracker/ptTables.cpp ../../core/protracker/ptSamples.cpp -o test_protracker
          ./test_protracker

      - name: Cache GNU Arm Embedded Toolchain 10.3-2021.10
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: agt/10.3
          key: arm-none-eabi-10.3-2021.10-linux-x86_64

      - name: Install GNU Arm Embedded Toolchain 10.3-2021.10
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2 make python3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
          mkdir -p agt/10.3
          tar -xjf gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2 -C agt/10.3 --strip-components=1
          rm gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2

      - name: Build the Tracker+ firmware
        run: |
          set -o pipefail
          make plus PLUS_POSTFIX=protracker_$(git rev-parse --short=7 HEAD) 2>&1 | tee build_output.log

      - name: Linker memory usage
        if: always()
        run: |
          {
            echo "### Firmware"
            echo '```text'
            ls -lh build/*.ptf || true
            echo '```'
            echo "### Linker memory usage"
            echo '```text'
            grep -E "Memory region|FLASH:|RAM:|EXTERNAL_RAM:|QSPI_FLASH:|SRAM_DTC:|SRAM_ITC:|SRAM_OC:" build_output.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware (.ptf)
        uses: actions/upload-artifact@v4
        with:
          name: protracker-tracker-plus-firmware
          path: build/*.ptf
